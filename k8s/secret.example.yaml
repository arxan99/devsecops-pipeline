# Example only. Create the real secret out of band (or with External Secrets / Sealed Secrets);
# never commit real keys. Values are SHA-256 hashes of API keys, not the keys themselves.
#   python -c "import hashlib;print(hashlib.sha256(b'your-key').hexdigest())"
apiVersion: v1
kind: Secret
metadata:
  name: secure-notes-api-keys
  namespace: secure-notes
type: Opaque
stringData:
  API_KEY_HASHES: "alice:REPLACE_WITH_SHA256_HASH"
